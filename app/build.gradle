plugins {
    id 'com.android.application'
}

// CI passes -PversionCode=<run number> so every build can be installed over the last one.
def vCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    namespace 'com.opencard.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.opencard.app'
        minSdk 26
        targetSdk 35
        versionCode vCode
        versionName "1.0.${vCode}"
    }

    // Signing: CI writes app/keystore.properties (from repository secrets or a
    // cached, CI-generated key). Neither file is ever committed.
    def ksProps = new Properties()
    def ksFile = file('keystore.properties')
    if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Without a keystore, fall back to the debug key so local builds still install.
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
