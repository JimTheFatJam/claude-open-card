org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true

# ---- In-app updater ----------------------------------------------------------
# GitHub repository whose *latest release* provides updates, and the APK asset name.
# The release workflow also uploads "<asset>.sha256". Leave owner empty to disable updates.
updater.githubOwner=JimTheFatJam
updater.githubRepo=claude-open-card
updater.apkAsset=OpenCard.apk
# Which release to follow: releases/latest (default), or releases/tags/<tag> for a test channel.
updater.releasePath=releases/latest
