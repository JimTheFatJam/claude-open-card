name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # release notes list the commits since the previous release

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Signing (permanent key from secrets, or a cached temporary key) - see the composite action
      - name: Signing config
        uses: ./.github/actions/android-signing
        with:
          keystore-b64: ${{ secrets.OPENCARD_KEYSTORE_B64 }}
          keystore-password: ${{ secrets.OPENCARD_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.OPENCARD_KEY_ALIAS }}

      - name: Unit tests (updater)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest -PversionCode=${{ github.run_number }}

      - name: Build signed release APK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
          # asset name is configured once, in gradle.properties (updater.apkAsset)
          ASSET=$(grep '^updater.apkAsset=' gradle.properties | cut -d= -f2)
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          # checksum file used by the in-app updater (sha256sum format)
          sha256sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCard-apk
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          # The release notes are the changelog shown by the in-app updater.
          PREV=$(git tag --list 'v1.0.*' --sort=-v:refname --merged HEAD | head -n1)
          {
            echo "## What's new"
            git log --no-merges --pretty='- %s' ${PREV:+$PREV..}HEAD | head -n 30
            echo
            echo "### Install"
            echo "Open Card updates itself on Wi-Fi. To install manually, tap **$ASSET** below on your Android device."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "$ASSET.sha256")\`"
          } > notes.md
          cat notes.md
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
            --target "${{ github.sha }}" \
            --title "Open Card $TAG" \
            --notes-file notes.md \
            --latest
